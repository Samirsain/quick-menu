# QuickMenu on your own server, behind Cloudflare (DNS proxied, SSL/TLS mode "Full (strict)").
# Install:
#   sudo cp deploy/nginx/quickmenu.biz.conf /etc/nginx/sites-available/quickmenu.biz
#   sudo ln -s /etc/nginx/sites-available/quickmenu.biz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificate: a Cloudflare Origin Certificate (Cloudflare → SSL/TLS → Origin Server), saved at the two paths below.

server {
    listen 80;
    listen [::]:80;
    server_name quickmenu.biz www.quickmenu.biz;
    return 301 https://quickmenu.biz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quickmenu.biz;
    ssl_certificate     /etc/ssl/quickmenu.biz/cert.pem;
    ssl_certificate_key /etc/ssl/quickmenu.biz/key.pem;
    return 301 https://quickmenu.biz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quickmenu.biz;

    ssl_certificate     /etc/ssl/quickmenu.biz/cert.pem;
    ssl_certificate_key /etc/ssl/quickmenu.biz/key.pem;

    root /var/www/quickmenu/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Security headers (moved here from the old Cloudflare Pages _headers file).
    # Keep add_header only at this level: nginx drops these in any location that adds its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.onesignal.com https://*.onesignal.com https://onesignal.com https://api.onesignal.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com https://*.supabase.co https://*.supabase.in https://onesignal.com https://*.onesignal.com; connect-src 'self' https://api.cloudinary.com https://*.supabase.co wss://*.supabase.co https://onesignal.com https://*.onesignal.com https://api.onesignal.com https://cdn.onesignal.com https://static.cloudflareinsights.com; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Hashed build files never change: cache for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The app shell and the service worker must always be fresh, or updates never reach phones
    location = /index.html { expires -1; }
    location = /OneSignalSDKWorker.js { expires -1; }
    location = /manifest.json { expires 1h; }

    # Single-page app: every route (/menu/..., /dashboard, /kitchen) falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
