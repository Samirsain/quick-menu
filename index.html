<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>QuickMenu - QR Menu & Ordering System</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#B0522C" />
    <!-- Stop phone browsers (Chrome "darken sites", Samsung Internet, MIUI) from auto-inverting the cream palette -->
    <meta name="color-scheme" content="only light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QuickMenu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- OneSignal Push Notifications -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Push (OneSignal) runs on the live site only; OneSignal itself refuses origins that don't match its Site URL.
      // window.__QM_PUSH_ON__ is the one switch the app reads (Settings > Notifications).
      window.__QM_PUSH_ON__ = !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname);
      // The bell button is for staff; guests at /menu never see it
      const isStaffPage = /^\/(dashboard|kitchen)/.test(window.location.pathname);

      if (window.__QM_PUSH_ON__) {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.init({
              appId: "2d283efb-dc80-4520-87ad-23040771c26e",
              safari_web_id: "web.onesignal.auto.4345f3b9-0648-4376-838e-008c1d802430",
              serviceWorkerPath: "/OneSignalSDKWorker.js",
              // Prompt settings
              promptOptions: {
                slidedown: {
                  prompts: [{
                    type: "push",
                    autoPrompt: false, // We'll prompt manually in dashboard
                    text: {
                      actionMessage: "Get notified when new orders come in!",
                      acceptButton: "Allow",
                      cancelButton: "Later"
                    }
                  }]
                }
              },
              notifyButton: {
                enable: isStaffPage,
              },
              // Welcome notification
              welcomeNotification: {
                title: "QuickMenu Notifications",
                message: "You'll now receive order alerts!"
              }
            });
          } catch (error) {
            console.warn('Push notifications unavailable on this site:', error);
          }
        });
      }
    </script>
    <meta name="description" content="Modern QR ordering system for restaurants. Contactless menu browsing, real-time order tracking, and customer feedback." />
    <meta name="author" content="QuickMenu" />

    <meta property="og:title" content="QuickMenu - QR Menu & Ordering System" />
    <meta property="og:description" content="Modern QR ordering system for restaurants. Contactless menu browsing, real-time order tracking, and customer feedback." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://quickmenu.biz/quickmenu-demo.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quickmenu.biz/quickmenu-demo.jpg" />
    
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
