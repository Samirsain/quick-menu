<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>QuickMenu - QR Menu & Ordering System</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#B0522C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QuickMenu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- OneSignal Push Notifications -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      console.log('🔔 OneSignal script loading...');
      
      // Only initialize OneSignal on the production domain (must match the Site URL set in OneSignal)
      const isProductionDomain = window.location.hostname === 'quickmenu-cpt.pages.dev';
      
      if (isProductionDomain) {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          console.log('🔔 OneSignal initializing...');
          try {
            await OneSignal.init({
              appId: "4d95ee74-a8c3-465f-9a2f-629f5ff98700",
              allowLocalhostAsSecureOrigin: true,
              serviceWorkerPath: "/OneSignalSDKWorker.js",
              // Prompt settings
              promptOptions: {
                slidedown: {
                  prompts: [{
                    type: "push",
                    autoPrompt: false, // We'll prompt manually in dashboard
                    text: {
                      actionMessage: "Get notified when new orders come in!",
                      acceptButton: "Allow",
                      cancelButton: "Later"
                    }
                  }]
                }
              },
              // Notification settings
              notifyButton: {
                enable: false, // We handle this in dashboard
              },
              // Welcome notification
              welcomeNotification: {
                title: "QuickMenu Notifications",
                message: "You'll now receive order alerts!"
              }
            });
            
            console.log('✅ OneSignal initialized successfully!');
            
            // Log current state
            const permission = await OneSignal.Notifications.permission;
            console.log('🔔 Current permission:', permission);
          } catch (error) {
            console.error('❌ OneSignal initialization error:', error);
          }
        });
      } else {
        console.log('⚠️ OneSignal skipped - only runs on quickmenu-cpt.pages.dev (current:', window.location.hostname, ')');
      }
    </script>
    <meta name="description" content="Modern QR ordering system for restaurants. Contactless menu browsing, real-time order tracking, and customer feedback." />
    <meta name="author" content="QuickMenu" />

    <meta property="og:title" content="QuickMenu - QR Menu & Ordering System" />
    <meta property="og:description" content="Modern QR ordering system for restaurants. Contactless menu browsing, real-time order tracking, and customer feedback." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://quickmenu-cpt.pages.dev/quickmenu-demo.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quickmenu-cpt.pages.dev/quickmenu-demo.jpg" />
    
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
